# Issue ENAutoEN：
# 1. EN issue AutoEN（EN + ENStatus），ENManualEN。
# 2. EN needs-info EN 14 EN → EN stale，EN 7 EN。
# 3. EN issue 60 EN → EN stale，EN 14 EN。feature / pinned ENAutoEN。
name: Issue hygiene

on:
  issues:
    types: [opened]
  schedule:
    - cron: "0 2 * * *"   # EN 10:00 EN
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'EN，EN。ENProject，issue EN **EN** EN triage，EN。',
              '',
              '- CurrentStatusEN：#96',
              '- IfEN bug EN **Version / EN / EN** EN，EN `needs-info`，14 ENAutoEN（EN）。',
              '- EN [Discussions](https://github.com/nd7hdyt/YtClipper/discussions)。',
              '',
              '_This project is maintained in spare time; issues are triaged weekly. Bugs missing version / platform / model get `needs-info` and auto-close after 14 days without a reply._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  stale-needs-info:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          only-labels: needs-info
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: "EN（Version / EN / EN / EN），7 ENAutoEN。ENAutoENProcessing。"
          close-issue-message: "EN。EN。"
          remove-stale-when-updated: true
          operations-per-run: 100

  stale-general:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          exempt-issue-labels: pinned,feature,needs-info
          exempt-all-milestones: true
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: "60 EN，EN stale；IfENPleaseEN，Else 14 ENAutoEN。"
          stale-pr-message: "45 EN，EN stale；ENPleaseEN，Else 14 ENAutoEN。"
          close-issue-message: "ENAutoEN。EN issue。"
          close-pr-message: "ENAutoEN。"
          remove-stale-when-updated: true
          operations-per-run: 100
