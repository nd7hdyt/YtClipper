name: Sync release info

on:
  repository_dispatch:
    types: [autoclip-release]
  schedule:
    - cron: "17 3 * * *"   # pertranslated 03:17 UTC（11:17 translated）
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（if v1.3.0）；translated latest"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync index.html to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag || '' }}
        run: python3 scripts/sync_release.py $TAG

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "translatedIstranslated"; exit 0
          fi
          VER=$(grep -oE 'releases/download/v[0-9]+\.[0-9]+\.[0-9]+/' index.html | head -1 | grep -oE 'v[0-9.]+')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync download links to AutoClip $VER"
          git push
