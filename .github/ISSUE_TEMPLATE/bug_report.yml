name: 🐛 Bug EN / Bug report
description: EN、EN、EN / Something is broken
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        EN。EN，EN；ENVersion / EN / EN issue ENProcessing。
        Thanks for reporting. Version, platform and model are required for us to reproduce.

  - type: dropdown
    id: platform
    attributes:
      label: EN / Platform
      options:
        - macOS EN (Apple Silicon)
        - Windows EN (x64)
        - Docker
        - EN / From source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AutoClip Version / Version
      description: EN「EN」EN / Shown in Settings → About
      placeholder: "v1.2.1"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: EN / LLM provider
      placeholder: "EN EN qwen-plus / OpenAI gpt-4o / EN / EN OpenAI EN"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: EN / Video source
      options:
        - BEN / Bilibili
        - YouTube
        - EN / Local file
        - EN / N/A
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: EN / What happened
      description: EN、EN、EN / Steps, expected, actual
      placeholder: |
        1. EN https://…
        2. EN「EN」
        3. EN「EN 63%」EN / EN xxx
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: EN / EN / Logs or screenshots
      description: |
        EN：macOS `~/Library/Application Support/AutoClip/logs`，Windows `%APPDATA%\AutoClip\logs`。EN 50 EN，EN API Key。
      render: text
