# Issue translated：
# 1. translated issue translatedonetranslated（translated + translatedstatus），translatedusetranslated。
# 2. translated needs-info translated 14 translatedinfo → translated stale，translated 7 translated。
# 3. translated issue 60 translated → translated stale，translated 14 translated。feature / pinned translated。
name: Issue hygiene

on:
  issues:
    types: [opened]
  schedule:
    - cron: "0 2 * * *"   # pertranslated 10:00 translated
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'translated，translated。thisIsone translated'stranslatedproject，issue translatedin **onetranslated** translatedone triage，translated。',
              '',
              '- translatedstatusandtranslatedissue：#96',
              '- iftranslatedIs bug translated **version / translated / model** info，translated `needs-info`，14 translated（translatedcan）。',
              '- usetranslatedissuetranslated [Discussions](https://github.com/zhouxiaoka/autoclip/discussions)。',
              '',
              '_This project is maintained in spare time; issues are triaged weekly. Bugs missing version / platform / model get `needs-info` and auto-close after 14 days without a reply._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  stale-needs-info:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          only-labels: needs-info
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: "translated'sinfo（version / translated / model / logs），7 translated。translatedprocess。"
          close-issue-message: "translatedinfotranslated。translatedinfotranslatedcantranslated。"
          remove-stale-when-updated: true
          operations-per-run: 100

  stale-general:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          exempt-issue-labels: pinned,feature,needs-info
          exempt-all-milestones: true
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: "60 translated，translated stale；iftranslatedissuetranslatedintranslatedonetranslated，translated 14 translated。"
          stale-pr-message: "45 translated，translated stale；iftranslatedintranslated，translated 14 translated。"
          close-issue-message: "translated。issuetranslatedin'stranslatedortranslated issue。"
          close-pr-message: "translated。"
          remove-stale-when-updated: true
          operations-per-run: 100
