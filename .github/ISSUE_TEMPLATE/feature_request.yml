name: ✨ EN / Feature request
description: EN AutoClip EN / Suggest something new
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: EN / The problem
      description: EN，EN：EN、EN / Describe the situation, not the solution
      placeholder: "ENProcessing 5 EN 2 EN，ENManual……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: EN / What you'd like
      placeholder: "IfEN……EN"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: EN / Platform
      options:
        - macOS EN
        - Windows EN
        - Docker / EN
    validations:
      required: false
