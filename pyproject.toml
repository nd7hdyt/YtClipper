[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip"
version = "1.3.0"
description = "AutoClip — AI ENAutoEN：CLI EN MCP server EN"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# ENDependenciesEN requirements.txt EN（EN / Docker / CI EN）；EN，
# EN README：pip install -r requirements.txt && pip install -e .
dependencies = []

[project.scripts]
autoclip = "backend.cli:main"
autoclip-mcp = "backend.mcp_server:main"

[project.urls]
Homepage = "https://github.com/nd7hdyt/YtClipper"
Issues = "https://github.com/nd7hdyt/YtClipper/issues"

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[tool.setuptools.package-data]
backend = ["prompt/*.txt", "prompt/**/*.txt"]
